%YAML:1.0

File.version: "1.0"

Camera.type: "PinHole"

Camera1.fx: 427.417
Camera1.fy: 426.714
Camera1.cx: 435.525
Camera1.cy: 244.974

Camera1.k1: -0.05629
Camera1.k2: 0.06567
Camera1.p1: 0.000058
Camera1.p2: 0.000832

Camera.width: 848
Camera.height: 480
Camera.fps: 30
Camera.RGB: 1

#--------------------------------------------------------------------------------------------
# IMU Parameters
#--------------------------------------------------------------------------------------------
IMU.Frequency: 200.0
IMU.GyroThreshold: 0.2
IMU.AccThreshold: 1.0
IMU.NoiseGyro: 1.5e-1      # v1已验证可初始化
IMU.NoiseAcc:  1.5e0        # v1已验证
IMU.GyroWalk: 1e-4         # v1原始值
IMU.AccWalk: 1e-3           # v1原始值
IMU.InsertKFsWhenLost: 1   # 丢跟踪时也插关键帧，给IMU更多数据

# Tbc: 相机到 IMU 的变换矩阵 (从 D456 标定)
IMU.T_b_c1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [0.999903, -0.0138036, -0.00208099, -0.0202141,
         0.0137985, 0.999902, -0.00243498, 0.00505961,
         0.0021144, 0.00240603, 0.999995, 0.0114047,
         0.0, 0.0, 0.0, 1.0]

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------
ORBextractor.nFeatures: 2000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 10
ORBextractor.minThFAST: 5

#--------------------------------------------------------------------------------------------
# Viewer
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0

System.SaveAtlasToFile: ""
System.LoadAtlasFromFile: ""
System.thFarPoints: 100.0
