%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "PinHole"

# ORB-SLAM3 特有的相机内参格式（从 bag 的 camera_intrinsics.json 读取）
Camera1.fx: 427.417
Camera1.fy: 426.714
Camera1.cx: 435.525
Camera1.cy: 244.974

# 畸变参数（从 bag 获取）
Camera1.k1: -0.05629
Camera1.k2: 0.06567
Camera1.p1: 0.000058
Camera1.p2: 0.000832

# 以下为相机全局属性
Camera.width: 848
Camera.height: 480
# 实际采集帧率 ~14fps
Camera.fps: 30

# Color order of the images (0: BGR, 1: RGB)
Camera.RGB: 1

# Depth map values factor
RGBD.DepthMapFactor: 1000.0

# ORB-SLAM3 深度与基线参数
Stereo.ThDepth: 40.0
Stereo.b: 0.05

#--------------------------------------------------------------------------------------------
# IMU Parameters (rgbd_inertial 模式需要)
#--------------------------------------------------------------------------------------------
IMU.T_b_c1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [0.999903, -0.0138036, -0.00208099, -0.0202141,
         0.0137985, 0.999902, -0.00243498, 0.00505961,
         0.0021144, 0.00240603, 0.999995, 0.0114047,
         0.0, 0.0, 0.0, 1.0]
IMU.InsertKFsWhenLost: 0
IMU.NoiseGyro: 1e-2
IMU.NoiseAcc: 1e-1
IMU.GyroWalk: 1e-6
IMU.AccWalk: 1e-4
IMU.Frequency: 200.0

#--------------------------------------------------------------------------------------------
# ORB Parameters (室外场景：更多特征 + 更低阈值)
#--------------------------------------------------------------------------------------------
ORBextractor.nFeatures: 2000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 10
ORBextractor.minThFAST: 5

#--------------------------------------------------------------------------------------------
# Viewer Parameters (Pangolin UI)
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0

System.SaveAtlasToFile: ""
System.LoadAtlasFromFile: ""
System.thFarPoints: 100.0
